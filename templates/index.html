<!DOCTYPE html>

<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Klasifikasi Daun Kelapa Sawit</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(
        135deg,
        #e8f5e9,
        #f1f8e9
    );
    min-height:100vh;
    padding:30px;
}

.container{
    max-width:900px;
    margin:auto;
    background:white;
    border-radius:20px;
    padding:30px;
    box-shadow:0 10px 30px rgba(0,0,0,0.15);
}

.header{
    text-align:center;
    margin-bottom:30px;
}

.header h1{
    color:#2e7d32;
    margin-bottom:10px;
}

.header p{
    color:#666;
}

.upload-box{
    border:2px dashed #81c784;
    padding:30px;
    border-radius:15px;
    text-align:center;
    background:#f9fff9;
}

.preview{
    margin-top:20px;
}

.preview img{
    max-width:350px;
    border-radius:15px;
    display:none;
    margin:auto;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

.btn{
    margin-top:20px;
    background:#2e7d32;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
}

.btn:hover{
    background:#1b5e20;
}

.result{
    margin-top:30px;
    padding:25px;
    border-radius:15px;
    background:#e8f5e9;
    text-align:center;
}

.result img{
    max-width:350px;
    border-radius:15px;
    margin-top:15px;
}

.prediksi{
    font-size:24px;
    font-weight:bold;
    color:#1b5e20;
    margin-top:15px;
}

.confidence{
    font-size:18px;
    margin-top:10px;
}

.error{
    color:red;
    text-align:center;
    margin-top:20px;
    font-weight:bold;
}

.footer{
    margin-top:30px;
    text-align:center;
    color:#777;
}

</style>

</head>

<body>

<div class="container">

```
<div class="header">

    <h1>
        Klasifikasi Penyakit Daun Kelapa Sawit
    </h1>

    <p>
        
    </p>

</div>

<form
    action="/"
    method="POST"
    enctype="multipart/form-data"
>

    <div class="upload-box">

        <h3>
            Upload Gambar Daun Sawit
        </h3>

        <br>

        <input
            type="file"
            name="image"
            accept="image/*"
            required
            onchange="previewImage(event)"
        >

        <div class="preview">

            <img id="preview">

        </div>

        <br>

        <button
            type="submit"
            class="btn"
        >
            Prediksi
        </button>

    </div>

</form>

{% if error %}

<p class="error">
    {{ error }}
</p>

{% endif %}

{% if hasil %}

<div class="result">

    <h2>
        Hasil Prediksi
    </h2>

    <img
        src="{{ image_path }}"
    >

    <div class="prediksi">
        {{ hasil }}
    </div>

    <div class="confidence">
        Confidence :
        <b>{{ confidence }}%</b>
    </div>

</div>

{% endif %}

<div class="footer">
    Sistem Klasifikasi Daun Kelapa Sawit
</div>
```

</div>

<script>

function previewImage(event){

    const preview =
        document.getElementById('preview');

    preview.src =
        URL.createObjectURL(
            event.target.files[0]
        );

    preview.style.display =
        'block';
}

</script>

</body>
</html>
